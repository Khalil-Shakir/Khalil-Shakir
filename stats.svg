<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="GitHub stats for Khalil Shakir">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7c99a"/>
      <stop offset="100%" stop-color="#57653c"/>
    </linearGradient>
    <radialGradient id="ringBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e341c"/>
      <stop offset="100%" stop-color="#1a1f10"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .ring-arc { fill: none; stroke: url(#ringGrad); stroke-width: 12; stroke-linecap: round;
                  stroke-dasharray: 322; stroke-dashoffset: 322; animation: drawRing 1.8s ease-out forwards; }
      @keyframes drawRing { to { stroke-dashoffset: 84; } }
      .num { opacity: 0; animation: numUp 1s ease .6s forwards; }
      @keyframes numUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .row { opacity: 0; transform: translateX(-16px); animation: rowIn .6s ease forwards; }
      @keyframes rowIn { to { opacity: 1; transform: translateX(0); } }
      .bar-track { fill: #2e341c; }
      .bar-fill { fill: #8ea675; transform-origin: 0 50%; animation: grow 1.4s ease-out forwards; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <rect x="0" y="0" width="440" height="300" rx="18" fill="#23281a" stroke="#57653c" stroke-width="2" filter="url(#shadow)"/>

  <!-- Rank ring -->
  <g transform="translate(120, 118)">
    <circle cx="0" cy="0" r="72" fill="url(#ringBg)" stroke="#2e341c" stroke-width="12"/>
    <circle class="ring-arc" cx="0" cy="0" r="72" transform="rotate(-90)"/>
    <text x="0" y="-8" text-anchor="middle" fill="#f1e7d0" font-size="30" font-weight="700" class="num">A+</text>
    <text x="0" y="18" text-anchor="middle" fill="#8ea675" font-size="12" class="num">RANK</text>
  </g>

  <!-- Stat rows -->
  <g transform="translate(230, 60)">
    <text x="0" y="0" fill="#f1e7d0" font-size="14" class="row">Repos</text>
    <text x="150" y="0" fill="#c9d9ae" font-size="14" class="row" style="animation-delay:.2s">12</text>
    <rect class="bar-track" x="0" y="10" width="160" height="7" rx="3.5"/>
    <rect class="bar-fill" x="0" y="10" width="130" height="7" rx="3.5"/>
  </g>
  <g transform="translate(230, 115)">
    <text x="0" y="0" fill="#f1e7d0" font-size="14" class="row">Stars</text>
    <text x="150" y="0" fill="#c9d9ae" font-size="14" class="row" style="animation-delay:.3s">24</text>
    <rect class="bar-track" x="0" y="10" width="160" height="7" rx="3.5"/>
    <rect class="bar-fill" x="0" y="10" width="150" height="7" rx="3.5"/>
  </g>
  <g transform="translate(230, 170)">
    <text x="0" y="0" fill="#f1e7d0" font-size="14" class="row">Followers</text>
    <text x="150" y="0" fill="#c9d9ae" font-size="14" class="row" style="animation-delay:.4s">15</text>
    <rect class="bar-track" x="0" y="10" width="160" height="7" rx="3.5"/>
    <rect class="bar-fill" x="0" y="10" width="110" height="7" rx="3.5"/>
  </g>
  <g transform="translate(230, 225)">
    <text x="0" y="0" fill="#f1e7d0" font-size="14" class="row">Contribs</text>
    <text x="150" y="0" fill="#c9d9ae" font-size="14" class="row" style="animation-delay:.5s">900</text>
    <rect class="bar-track" x="0" y="10" width="160" height="7" rx="3.5"/>
    <rect class="bar-fill" x="0" y="10" width="155" height="7" rx="3.5"/>
  </g>
</svg>
