<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 195" width="460" height="195">
  <defs>
    <linearGradient id="l-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F150E"/>
      <stop offset="100%" stop-color="#080B07"/>
    </linearGradient>
    <linearGradient id="l-py" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B6640"/>
      <stop offset="100%" stop-color="#C4D7B2"/>
    </linearGradient>
    <linearGradient id="l-ts" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D3E28"/>
      <stop offset="100%" stop-color="#87A97B"/>
    </linearGradient>
    <linearGradient id="l-sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2B1A"/>
      <stop offset="100%" stop-color="#607D53"/>
    </linearGradient>
    <linearGradient id="l-ht" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151E14"/>
      <stop offset="100%" stop-color="#3B5033"/>
    </linearGradient>
    <radialGradient id="l-donut-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4D7B2" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C4D7B2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="l-clip"><rect width="460" height="195" rx="12" ry="12"/></clipPath>
  </defs>

  <style>
    .l-row { opacity:0; animation: l-fadeUp 0.5s ease-out forwards; }
    @keyframes l-fadeUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .l-blink { animation: l-bl 2s step-end infinite; }
    @keyframes l-bl { 50%{ opacity:0.12; } }
  </style>

  <g clip-path="url(#l-clip)">
    <!-- Background -->
    <rect width="460" height="195" fill="url(#l-bg)"/>

    <!-- Subtle Grid -->
    <g stroke="rgba(163,184,153,0.025)" stroke-width="0.6">
      <line x1="0" y1="48" x2="460" y2="48"/>
      <line x1="0" y1="96" x2="460" y2="96"/>
      <line x1="0" y1="144" x2="460" y2="144"/>
      <line x1="115" y1="0" x2="115" y2="195"/>
      <line x1="230" y1="0" x2="230" y2="195"/>
      <line x1="345" y1="0" x2="345" y2="195"/>
    </g>

    <!-- ═══ LEFT: DONUT CHART ═══ -->
    <g>
      <circle cx="80" cy="108" r="50" fill="url(#l-donut-glow)"/>

      <!-- Track -->
      <circle cx="80" cy="108" r="40" fill="none" stroke="rgba(163,184,153,0.06)" stroke-width="10"/>

      <!-- Python Arc: 58.2% of 251 ≈ 146 -->
      <circle cx="80" cy="108" r="40" fill="none" stroke="#C4D7B2" stroke-width="10"
              stroke-dasharray="251" stroke-dashoffset="251" stroke-linecap="butt"
              transform="rotate(-90 80 108)">
        <animate attributeName="stroke-dashoffset" from="251" to="105" dur="1.6s"
                 begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
      </circle>

      <!-- TypeScript Arc: 24.1% of 251 ≈ 60.5, offset from Python end -->
      <circle cx="80" cy="108" r="40" fill="none" stroke="#87A97B" stroke-width="10"
              stroke-dasharray="60.5 190.5" stroke-dashoffset="312" stroke-linecap="butt"
              transform="rotate(-90 80 108)">
        <animate attributeName="stroke-dashoffset" from="356" to="312" dur="1.6s"
                 begin="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
      </circle>

      <!-- Shell Arc: 11.7% of 251 ≈ 29.4 -->
      <circle cx="80" cy="108" r="40" fill="none" stroke="#607D53" stroke-width="10"
              stroke-dasharray="29.4 221.6" stroke-dashoffset="280.6" stroke-linecap="butt"
              transform="rotate(-90 80 108)">
        <animate attributeName="stroke-dashoffset" from="310" to="280.6" dur="1.6s"
                 begin="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
      </circle>

      <!-- HTML Arc: 6.0% of 251 ≈ 15.1 -->
      <circle cx="80" cy="108" r="40" fill="none" stroke="#3B5033" stroke-width="10"
              stroke-dasharray="15.1 235.9" stroke-dashoffset="266.2" stroke-linecap="butt"
              transform="rotate(-90 80 108)">
        <animate attributeName="stroke-dashoffset" from="281" to="266.2" dur="1.6s"
                 begin="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
      </circle>

      <!-- Center Label -->
      <circle cx="80" cy="108" r="28" fill="rgba(14,19,13,0.92)" stroke="rgba(163,184,153,0.08)" stroke-width="0.6"/>
      <text x="80" y="105" font-family="'Outfit','Inter',sans-serif" font-size="9" font-weight="800"
            fill="#87A97B" text-anchor="middle" letter-spacing="1">LANGS</text>
      <text x="80" y="119" font-family="'Outfit','Inter',sans-serif" font-size="14" font-weight="900"
            fill="#DFF2D8" text-anchor="middle">4</text>
    </g>

    <!-- ═══ RIGHT: LANGUAGE BARS ═══ -->
    <g>
      <!-- Title -->
      <text x="165" y="30" font-family="'Outfit','Inter',sans-serif" font-size="13"
            font-weight="900" fill="#87A97B" letter-spacing="1.5">MOST USED LANGUAGES</text>

      <!-- Combined Top Bar -->
      <rect x="165" y="42" width="265" height="6" rx="3" fill="rgba(163,184,153,0.06)"/>
      <!-- Python segment -->
      <rect x="165" y="42" width="0" height="6" rx="3" fill="#C4D7B2">
        <animate attributeName="width" from="0" to="154" dur="1.4s" begin="0.4s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
      </rect>
      <!-- TS segment -->
      <rect x="319" y="42" width="0" height="6" fill="#87A97B">
        <animate attributeName="width" from="0" to="64" dur="1.4s" begin="0.6s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
      </rect>
      <!-- Shell segment -->
      <rect x="383" y="42" width="0" height="6" fill="#607D53">
        <animate attributeName="width" from="0" to="31" dur="1.4s" begin="0.8s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
      </rect>
      <!-- HTML segment -->
      <rect x="414" y="42" width="0" height="6" rx="0 3 3 0" fill="#3B5033">
        <animate attributeName="width" from="0" to="16" dur="1.4s" begin="1.0s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
      </rect>

      <!-- Row 1: Python -->
      <g class="l-row" style="animation-delay:0.5s">
        <!-- Python Icon -->
        <g transform="translate(165,62) scale(0.85)">
          <path d="M12.5,1.5C9,1.5 7.3,3 7.3,5.7V8.5h5.4V9.4H4.4C2,9.4 0.8,11 0.8,13.4V17.4C0.8,19.8 2.2,21 4.6,21H6.8V18C6.8,15.5 8.9,13.6 11.3,13.6H16.6V8.8C16.6,5.5 14.4,3.6 12,3.6ZM10,4c0.5,0 0.8,0.3 0.8,0.8S10.5,5.6 10,5.6S9.2,5.3 9.2,4.8S9.5,4 10,4Z" fill="#87A97B"/>
          <path d="M11.5,22.5C15,22.5 16.7,21 16.7,18.3V15.5H11.3V14.6H19.6C22,14.6 23.2,13 23.2,10.6V6.6C23.2,4.2 21.8,3 19.4,3H17.2V6C17.2,8.5 15.1,10.4 12.7,10.4H7.4V15.2C7.4,18.5 9.6,20.4 12,20.4ZM14,20c-0.5,0-0.8-0.3-0.8-0.8s0.3-0.8 0.8-0.8s0.8,0.3 0.8,0.8S14.5,20 14,20Z" fill="#C4D7B2"/>
        </g>
        <text x="188" y="79" font-family="'Outfit',sans-serif" font-size="12" font-weight="700" fill="#DFF2D8">Python</text>
        <!-- Bar -->
        <rect x="260" y="72" width="130" height="7" rx="3.5" fill="rgba(163,184,153,0.08)"/>
        <rect x="260" y="72" width="0" height="7" rx="3.5" fill="url(#l-py)">
          <animate attributeName="width" from="0" to="96" dur="1.4s" begin="0.6s" fill="freeze"
                   calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
        </rect>
        <text x="430" y="80" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#C4D7B2" text-anchor="end">58.2%</text>
      </g>

      <!-- Row 2: TypeScript -->
      <g class="l-row" style="animation-delay:0.7s">
        <!-- TS Icon -->
        <g transform="translate(165,90) scale(0.85)">
          <rect x="0.5" y="0.5" width="22" height="22" rx="4" fill="#2D3E28" stroke="#607D53" stroke-width="0.5"/>
          <text x="12" y="17" font-family="'Outfit',sans-serif" font-size="11" font-weight="900" fill="#DFF2D8" text-anchor="middle">TS</text>
        </g>
        <text x="188" y="107" font-family="'Outfit',sans-serif" font-size="12" font-weight="700" fill="#DFF2D8">TypeScript</text>
        <rect x="260" y="100" width="130" height="7" rx="3.5" fill="rgba(163,184,153,0.08)"/>
        <rect x="260" y="100" width="0" height="7" rx="3.5" fill="url(#l-ts)">
          <animate attributeName="width" from="0" to="40" dur="1.4s" begin="0.8s" fill="freeze"
                   calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
        </rect>
        <text x="430" y="108" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#87A97B" text-anchor="end">24.1%</text>
      </g>

      <!-- Row 3: Shell -->
      <g class="l-row" style="animation-delay:0.9s">
        <!-- Shell Icon -->
        <g transform="translate(165,118) scale(0.85)">
          <rect x="0.5" y="0.5" width="22" height="22" rx="4" fill="#1E2B1A" stroke="#3B5033" stroke-width="0.5"/>
          <text x="4" y="15" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="900" fill="#A3B899">$_</text>
        </g>
        <text x="188" y="135" font-family="'Outfit',sans-serif" font-size="12" font-weight="700" fill="#DFF2D8">Shell</text>
        <rect x="260" y="128" width="130" height="7" rx="3.5" fill="rgba(163,184,153,0.08)"/>
        <rect x="260" y="128" width="0" height="7" rx="3.5" fill="url(#l-sh)">
          <animate attributeName="width" from="0" to="19" dur="1.4s" begin="1.0s" fill="freeze"
                   calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
        </rect>
        <text x="430" y="136" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#607D53" text-anchor="end">11.7%</text>
      </g>

      <!-- Row 4: HTML -->
      <g class="l-row" style="animation-delay:1.1s">
        <!-- HTML Icon -->
        <g transform="translate(165,146) scale(0.85)">
          <path d="M2,1 L21,1 L19,19 L11.5,22 L4,19 Z" fill="#1A2318" stroke="#3B5033" stroke-width="0.4"/>
          <path d="M11.5,2.5 L19.5,2.5 L17.8,17.5 L11.5,20 Z" fill="#2E3F29"/>
          <text x="11.5" y="13" font-family="'Outfit',sans-serif" font-size="7" font-weight="900" fill="#A3B899" text-anchor="middle">&lt;/&gt;</text>
        </g>
        <text x="188" y="163" font-family="'Outfit',sans-serif" font-size="12" font-weight="700" fill="#DFF2D8">HTML &amp; CSS</text>
        <rect x="260" y="156" width="130" height="7" rx="3.5" fill="rgba(163,184,153,0.08)"/>
        <rect x="260" y="156" width="0" height="7" rx="3.5" fill="url(#l-ht)">
          <animate attributeName="width" from="0" to="10" dur="1.4s" begin="1.2s" fill="freeze"
                   calcMode="spline" keyTimes="0;1" keySplines="0.25,0.1,0.25,1"/>
        </rect>
        <text x="430" y="164" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#3B5033" text-anchor="end">6.0%</text>
      </g>
    </g>

    <!-- Border -->
    <rect width="460" height="195" rx="12" ry="12" fill="none" stroke="rgba(163,184,153,0.2)" stroke-width="1.2"/>

    <!-- Annotation -->
    <text x="430" y="186" font-family="'JetBrains Mono',monospace" font-size="7" font-weight="700"
          fill="#607D53" opacity="0.5" text-anchor="end" class="l-blink">[ LOCAL TEMPLATE · STATIC DATA ]</text>
  </g>
</svg>