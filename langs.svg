<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-label="Most used languages for Khalil Shakir">
  <defs>
    <filter id="shadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .bar { opacity: 0; transform: translateY(14px); animation: barIn .6s ease forwards; }
      @keyframes barIn { to { opacity: 1; transform: translateY(0); } }
      .fill { transform-origin: 0 50%; animation: grow 1.5s ease-out forwards; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .pct { opacity: 0; animation: pctIn .4s ease 1.4s forwards; }
      @keyframes pctIn { to { opacity: 1; } }
    </style>
  </defs>

  <rect x="0" y="0" width="440" height="280" rx="18" fill="#23281a" stroke="#57653c" stroke-width="2" filter="url(#shadowL)"/>
  <text x="28" y="40" fill="#b7c99a" font-size="16" font-weight="700">MOST USED LANGUAGES</text>

  <g transform="translate(28, 72)">
    <text x="0" y="0" fill="#f1e7d0" font-size="14" class="bar">Python</text>
    <text x="360" y="0" fill="#c9d9ae" font-size="14" class="bar pct">45%</text>
    <rect x="0" y="10" width="360" height="9" rx="4.5" fill="#2e341c"/>
    <rect x="0" y="10" width="162" height="9" rx="4.5" fill="#3572A5" class="fill"/>
  </g>
  <g transform="translate(28, 122)">
    <text x="0" y="0" fill="#f1e7d0" font-size="14" class="bar" style="animation-delay:.3s">Kotlin</text>
    <text x="360" y="0" fill="#c9d9ae" font-size="14" class="bar pct" style="animation-delay:1.7s">30%</text>
    <rect x="0" y="10" width="360" height="9" rx="4.5" fill="#2e341c"/>
    <rect x="0" y="10" width="108" height="9" rx="4.5" fill="#A97BFF" class="fill"/>
  </g>
  <g transform="translate(28, 172)">
    <text x="0" y="0" fill="#f1e7d0" font-size="14" class="bar" style="animation-delay:.6s">JavaScript</text>
    <text x="360" y="0" fill="#c9d9ae" font-size="14" class="bar pct" style="animation-delay:2s">20%</text>
    <rect x="0" y="10" width="360" height="9" rx="4.5" fill="#2e341c"/>
    <rect x="0" y="10" width="72" height="9" rx="4.5" fill="#F1E05A" class="fill"/>
  </g>
  <g transform="translate(28, 222)">
    <text x="0" y="0" fill="#f1e7d0" font-size="14" class="bar" style="animation-delay:.9s">Other</text>
    <text x="360" y="0" fill="#c9d9ae" font-size="14" class="bar pct" style="animation-delay:2.3s">5%</text>
    <rect x="0" y="10" width="360" height="9" rx="4.5" fill="#2e341c"/>
    <rect x="0" y="10" width="18" height="9" rx="4.5" fill="#8ea675" class="fill"/>
  </g>
</svg>
