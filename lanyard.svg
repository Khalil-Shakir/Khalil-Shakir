<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="760" viewBox="0 0 440 760" role="img" aria-label="Khalil Shakir ID badge lanyard">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b4423"/>
      <stop offset="50%" stop-color="#57653c"/>
      <stop offset="100%" stop-color="#3b4423"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2413"/>
      <stop offset="100%" stop-color="#2e341c"/>
    </linearGradient>
    <linearGradient id="claspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9d9d9"/>
      <stop offset="50%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="50%" stop-color="#b3b3b3"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="45%" stop-color="rgba(255,255,255,0.28)" />
      <stop offset="55%" stop-color="rgba(255,255,255,0.35)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <radialGradient id="avatarRing" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="rgba(183,201,154,0)"/>
      <stop offset="85%" stop-color="rgba(183,201,154,0.8)"/>
      <stop offset="100%" stop-color="rgba(183,201,154,1)"/>
    </radialGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(183,201,154,0.4)"/>
      <stop offset="100%" stop-color="rgba(183,201,154,0)"/>
    </radialGradient>
    <clipPath id="avatarClip">
      <circle cx="220" cy="262" r="66"/>
    </clipPath>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .script { font-family: 'Caveat', 'Brush Script MT', cursive; }
      /* Pendulum: damped drop-in then gentle sway */
      .pendulum {
        transform-origin: 220px 0px;
        animation: dropIn 1.4s cubic-bezier(.2,.8,.3,1.15) forwards,
                   sway 3.8s ease-in-out 1.6s infinite;
      }
      @keyframes dropIn {
        0%   { transform: translateY(-760px) rotate(0deg); }
        55%  { transform: translateY(8px)  rotate(0deg); }
        75%  { transform: translateY(0)    rotate(-4deg); }
        90%  { transform: translateY(0)    rotate(3deg); }
        100% { transform: translateY(0)    rotate(0deg); }
      }
      @keyframes sway {
        0%,100% { transform: rotate(0deg); }
        50%     { transform: rotate(5deg); }
      }
      .shine-sweep { transform: translateX(-240px); animation: shine 4.5s ease-in-out 2s infinite; }
      @keyframes shine { 0%,20% { transform: translateX(-240px); } 60%,100% { transform: translateX(240px); } }
      .stamp { opacity: 0; animation: stampIn .4s cubic-bezier(.2,.9,.3,1.4) forwards; }
      @keyframes stampIn { 0% { opacity: 0; transform: scale(1.8); } 100% { opacity: 1; transform: scale(1); } }
      .holo { animation: holoGlow 3s ease-in-out infinite; }
      @keyframes holoGlow { 0%,100% { opacity: .55; } 50% { opacity: .95; } }
    </style>
  </defs>

  <g class="pendulum" filter="url(#dropShadow)">

    <!-- ===== STRAP ===== -->
    <g>
      <rect x="205" y="0" width="30" height="210" rx="6" fill="url(#strapGrad)"/>
      <!-- printed text down the strap -->
      <text x="220" y="46" fill="#c9d9ae" font-size="11" text-anchor="middle" transform="rotate(0 220 46)" font-weight="700">KHALIL</text>
      <text x="220" y="66" fill="#b7c99a" font-size="9" text-anchor="middle">SHAKIR</text>
      <text x="220" y="90" fill="#8ea675" font-size="8" text-anchor="middle">AI AUTOMATION</text>
      <text x="220" y="104" fill="#8ea675" font-size="8" text-anchor="middle">ENGINEER</text>
      <!-- stitch dashes -->
      <line x1="210" y1="120" x2="210" y2="200" stroke="#8ea675" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
      <line x1="230" y1="120" x2="230" y2="200" stroke="#8ea675" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
    </g>

    <!-- ===== METAL RING + CLASP ===== -->
    <circle cx="220" cy="218" r="16" fill="none" stroke="url(#ringGrad)" stroke-width="5"/>
    <rect x="202" y="226" width="36" height="26" rx="6" fill="url(#claspGrad)"/>
    <rect x="208" y="230" width="24" height="18" rx="4" fill="#6e6e6e"/>
    <circle cx="220" cy="239" r="4" fill="#9a9a9a"/>

    <!-- ===== CARD ===== -->
    <g>
      <rect x="110" y="260" width="220" height="330" rx="18" fill="url(#cardGrad)" stroke="#57653c" stroke-width="2"/>
      <!-- card punch -->
      <circle cx="220" cy="278" r="6" fill="#1a1f10"/>
      <circle cx="220" cy="278" r="6" fill="none" stroke="#57653c" stroke-width="1.5"/>

      <!-- AVATAR inside glowing ring -->
      <circle cx="220" cy="262" r="96" fill="url(#avatarGlow)" class="holo"/>
      <circle cx="220" cy="262" r="72" fill="url(#avatarRing)"/>
      <!-- HEADSHOT_B64 -->
      <image x="154" y="196" width="132" height="132" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)" xlink:href="data:image/png;base64,HEADSHOT_B64"/>
      <!-- small "verified" sparkle -->
      <text x="288" y="196" fill="#b7c99a" font-size="16" class="sparkle">✦</text>

      <!-- NAME + ROLE -->
      <text x="220" y="380" fill="#f1e7d0" font-size="26" font-weight="700" text-anchor="middle" class="script">Khalil Shakir</text>
      <text x="220" y="408" fill="#b7c99a" font-size="13" text-anchor="middle" letter-spacing="1">AI Automation Engineer</text>
      <text x="220" y="432" fill="#8ea675" font-size="12" text-anchor="middle">@Khalil-Shakir</text>

      <!-- separator -->
      <line x1="140" y1="452" x2="300" y2="452" stroke="#57653c" stroke-width="1.5"/>

      <!-- BARCODE -->
      <g transform="translate(140, 472)">
        <rect x="0" y="0" width="3" height="46" fill="#c9d9ae"/>
        <rect x="6" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="10" y="4" width="3" height="42" fill="#c9d9ae"/>
        <rect x="16" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="20" y="2" width="3" height="44" fill="#c9d9ae"/>
        <rect x="26" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="30" y="6" width="3" height="40" fill="#c9d9ae"/>
        <rect x="36" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="40" y="3" width="3" height="43" fill="#c9d9ae"/>
        <rect x="46" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="50" y="5" width="3" height="41" fill="#c9d9ae"/>
        <rect x="56" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="60" y="2" width="3" height="44" fill="#c9d9ae"/>
        <rect x="66" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="70" y="4" width="3" height="42" fill="#c9d9ae"/>
        <rect x="76" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="80" y="1" width="3" height="45" fill="#c9d9ae"/>
        <rect x="86" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="90" y="6" width="3" height="40" fill="#c9d9ae"/>
        <rect x="96" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="100" y="3" width="3" height="43" fill="#c9d9ae"/>
        <rect x="106" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="110" y="5" width="3" height="41" fill="#c9d9ae"/>
        <rect x="116" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="120" y="2" width="3" height="44" fill="#c9d9ae"/>
        <rect x="126" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="130" y="4" width="3" height="42" fill="#c9d9ae"/>
        <rect x="136" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="140" y="1" width="3" height="45" fill="#c9d9ae"/>
        <rect x="146" y="0" width="1.5" height="46" fill="#c9d9ae"/>
        <rect x="150" y="6" width="3" height="40" fill="#c9d9ae"/>
      </g>
      <text x="220" y="538" fill="#8ea675" font-size="9" text-anchor="middle">KHALIL-SHAKIR</text>

      <!-- holographic shine sweep -->
      <rect x="110" y="260" width="220" height="330" rx="18" fill="url(#shineGrad)" class="shine-sweep"/>
    </g>
  </g>
</svg>
